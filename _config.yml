# Reference: https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#remote-theme-method
# Reference: https://github.com/mmistakes/mm-github-pages-starter
# Reference: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# Reference: https://github.com/mmistakes/minimal-mistakes/blob/master/_config.yml

title: Stevão Andrade
locale: en-US
url: https://stevaoaa.github.io
repository: stevaoaa/stevaoaa.github.io
description: >-
  Stevão Andrade. Senior Software Engineer and software testing specialist.
  Ph.D. in Computer Science (USP). Backend, cloud security, test automation,
  metamorphic and mutation testing.
minimal_mistakes_skin: default
search: true
encoding: utf-8
markdown: kramdown
theme: minimal-mistakes-jekyll
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Sao_Paulo

include:
  - _pages

exclude:
  - cv/*.tex
  - cv/*.cls
  - cv/*.sty
  - cv/cv/
  - cv/fonts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - curriculum_stevao.pdf
  - lattes.pdf

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

author:
  name: Stevão Andrade
  location: Teresina, Brasil
  email: stevao.andrade@gmail.com
  avatar: /assets/images/bio-photo.jpg
  bio: Senior Software Engineer & software testing specialist. Ph.D. in Computer Science (USP).
  links:
    - label: CV
      icon: fas fa-fw fa-file-pdf
      url: /cv/cv-stevao.pdf
    - label: Google Scholar
      icon: fas fa-fw fa-graduation-cap
      url: https://scholar.google.com/citations?user=8pvtUwkAAAAJ
    - label: Lattes
      icon: fas fa-fw fa-id-card
      url: http://lattes.cnpq.br/3305610198303147
    - label: X
      icon: fab fa-fw fa-x-twitter
      url: https://x.com/stevao_andrade
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/stevaoaa
    - label: Linkedin
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/stevaoaa/
    #- label: Stack Overflow
      #icon: fab fa-fw fa-stack-overflow
      #url: https://stackoverflow.com/users/00000000

footer:
  links:
    - label: X
      icon: fab fa-fw fa-x-twitter
      url: https://x.com/stevao_andrade
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/stevaoaa
    - label: Linkedin
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/stevaoaa/
    #- label: Stack Overflow
      #icon: fab fa-fw fa-stack-overflow
      #url: https://stackoverflow.com/users/00000000

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
  - scope:
      path: _pages
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
#  ignore:
#    envs: development

